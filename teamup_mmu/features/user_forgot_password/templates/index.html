{% extends "nav.html" %}
{% load static %}

{% block content %}
    <h2 style="text-align: center;">Welcome to the Password Reset Page!</h2>
    <style>
        #reset-container {
            background-color: #ffffff;
            max-width: 400px;
            margin: 50px auto;
            padding: 40px 30px;
            border-radius: 20px; /* Rounded corners */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Soft drop shadow */
            border: 1px solid #e0e0e0;
            font-family: 'Inter', sans-serif;
            text-align: center;
        }

        /* Styling for the SVG Icon */
        #reset-container svg {
            width: 3rem;
            height: 3rem;
            fill: #001561 !important;
            margin-bottom: 10px;
        }
        
        /* Make the title look nice */
        #reset-container h2 {
            color: #001561;
            margin: 0px;
            font-size: 1.5rem;
        }

        #reset-container p {
            margin-top: 10px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #a8a8a8;
            color: #666;
            font-size: 1.1rem;
        }

        #reset-container input[type="text"],
        #reset-container input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }
        
        #reset-container input[type="text"]:focus,
        #reset-container input[type="password"]:focus {
            outline: none;
            border-color: #001561;
            box-shadow: 0 0 5px rgba(0, 21, 97, 0.2);
        }

        #reset-container button[type="submit"] {
            padding: 8px 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 1rem;
            background-color: #001561;
            color: #fff;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        #reset-container button[type="submit"]:hover {
            background-color: #001a78dc;
            color: #fff;   
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.337);
        }

    </style>
    <div id="container-for-card">
        {% include 'user_forgot_password/templates/card.html' %}
    </div>
{% endblock %}
