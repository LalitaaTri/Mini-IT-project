{% for c in my_classes %}
<li class="class-card" hx-get="/classes/class_details/{{ c.id }}/" hx-target="body" hx-push-url="true">
    
    <!-- Left side of the card -->
    <div class="class-info">
        <h3 id="title-{{ c.id }}">{{ c.course_code }} - {{ c.course_name }}, {{ c.section }}, {{ c.trimester }}</h3>
        <p id="desc-{{ c.id }}">{{ c.description }}</p>
    </div>

    <!-- Right side of the card (stopPropagation! to prevent accident cliking to view details) -->
    <button class="leave_btn" onclick="event.stopPropagation();" 
        {% if c.user_role == 'admin' %}
        disabled title="As the creator, you cannot leave this class. You must delete it instead."
        {% else %}
        hx-get="/classes/leave_class/{{ c.id }}/" hx-target="#modal-container" hx-swap="innerHTML"
        {% endif %}>Leave</button>
    
</li>
{% empty %}
<div id="my-classes-empty-search" style="width: 100%; text-align: center; color: #00198379; background-color: #f5fcff; padding: 20px; border-radius: 10px; border: 1px dashed #00198379; box-sizing: border-box; grid-column: 1 / -1;">
    No classes match your search query.
</div>
{% endfor %}
