<div id="add-modal" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; border-radius: 16px; width: 100%; max-width: 500px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; margin: 16px;">
        
        <!-- Header -->
        <div style="padding: 1rem 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between;">
            <h3 style="margin: 0; font-size: 2rem; font-weight: 700; color: #1e293b;">🧑🏻‍🎓 Add Students</h3>
            <button 
                hx-get="/classes/class_details/{{ class_id }}/tab/students/"
                hx-target="#tabs-section"
                hx-on::after-request="document.getElementById('add-modal').remove()"
                style="background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: background-color 0.2s;"
                onmouseover="this.style.backgroundColor='#f1f5f9'; this.style.color='#64748b'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.color='#94a3b8'"
                title="Close and refresh">
                &times;
            </button>
        </div>

        <!-- Body -->
        <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; max-height: 70vh; overflow-y: auto;">
            
            <!-- Search Section -->
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="search-input" style="font-size: 1rem; font-weight: 600; color: #64748b;">Search Students</label>
                <div style="position: relative;">
                    <input 
                        id="search-input"
                        type="text" 
                        name="search_query" 
                        placeholder="Search by name or email..." 
                        hx-get="/classes/add_students_search/{{ class_id }}/" 
                        hx-trigger="keyup changed delay:300ms" 
                        hx-target="#search-results-list"
                        style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; transition: border-color 0.2s;"
                        onfocus="this.style.borderColor='#00186d'"
                        onblur="this.style.borderColor='#cbd5e1'"
                    />
                </div>
            </div>

            <!-- Dynamic Search/Suggestions Output -->
            <div id="search-results-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <span style="font-size: 1rem; font-weight: 600; color: #64748b; margin-bottom: 0.25rem;"><i>Suggested Students</i></span>
                
                {% for student in suggestions %}
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border: 1px solid #f1f5f9; background: #f8fafc; border-radius: 8px;">
                        <div style="display: flex; flex-direction: column; gap: 0.15rem;">
                            <span style="font-weight: 600; font-size: 0.9rem; color: #334155;">{{ student.username }}</span>
                            <span style="font-size: 0.8rem; color: #64748b;">{{ student.email }}</span>
                        </div>
                        <button 
                            hx-post="/classes/add_student_direct/{{ class_id }}/{{ student.id }}/"
                            hx-swap="outerHTML"
                            style="background: #00186d; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s;"
                            onmouseover="this.style.background='#00114a'"
                            onmouseout="this.style.background='#00186d'">
                            Add
                        </button>
                    </div>
                {% empty %}
                    <span style="font-size: 0.85rem; color: #94a3b8; font-style: italic;">No suggestions available.</span>
                {% endfor %}
            </div>

        </div>
                    <!-- Divider -->
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 0.5rem 0;" />

            <!-- CSV Upload Section -->
            <div style="padding: 1rem 1.5rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <span style="font-size: 1rem; font-weight: 600; color: #64748b;">Bulk Import via CSV</span>
                <form 
                    hx-post="/classes/upload_csv/{{ class_id }}/" 
                    hx-encoding="multipart/form-data" 
                    hx-target="#csv-upload-status"
                    style="display: flex; gap: 0.5rem; align-items: center;">
                    
                    <input 
                        type="file" 
                        name="csv_file" 
                        accept=".csv" 
                        required 
                        style="font-size: 0.85rem; color: #64748b; flex-grow: 1;"
                    />
                    
                    <button 
                        type="submit" 
                        style="background: #00186d; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s;"
                        onmouseover="this.style.background='#00114a'"
                        onmouseout="this.style.background='#00186d'">
                        Upload CSV
                    </button>
                </form>
                <!-- Status Message Output -->
                <div id="csv-upload-status" style="margin-top: 0.25rem; font-size: 0.85rem; font-weight: 500;"></div>
            </div>
    </div>
</div>
