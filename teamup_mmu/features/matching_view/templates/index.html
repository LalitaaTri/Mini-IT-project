{% extends "nav.html" %}
{% load static %}

{% block content %}
    <div style="text-align: center; margin-top: 1rem; margin-bottom: 1rem; padding: 0 20px;">
        <h1 style="margin: 0; font-size: 2.6rem; color: #00186d; font-weight: 800; letter-spacing: -0.5px;">Discover Teammates</h1>
        <p style="margin: 8px 0 0 0; color: #64748b; font-size: 1.05rem;">Browse profiles and match with students for your groups</p>
    </div>

    <style>
        /* Centers the entire list on the page */
        #user-list {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px 50px 20px;
        }

        /* The main Tinder-style card container */
        .user-card {
            background: white;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            border-radius: 28px;
            box-shadow: 0 20px 45px rgba(0, 24, 109, 0.12), 0 4px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 24, 109, 0.1);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0, 24, 109, 0.18), 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        /* Button Hover effects */
        .user-card button:hover:not([disabled]) {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        .user-card button:active:not([disabled]) {
            transform: translateY(0px);
        }
    </style>

    <div id="user-list">
        {% include 'matching_view/templates/card.html' %}
    </div>
{% endblock %}
