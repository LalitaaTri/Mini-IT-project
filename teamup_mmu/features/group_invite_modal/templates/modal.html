<div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;">
    <div style="background: white; padding: 2rem; border-radius: 15px; width: 300px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0; color: #001561;">Invite to Group(s)</h3>
        
        {% if context.groups %}
            <form hx-post="/invite_modal/send/" hx-target="#modal-container" hx-swap="innerHTML">
                {% csrf_token %}
                <input type="hidden" name="target_user_id" value="{{ context.target_user_id }}">
                
                <label style="display: block; margin-bottom: 10px; font-size: 0.9rem; font-weight: 600;">Select Groups:</label>
                
                <!-- NEW: Scrollable Checkbox List -->
                <div style="max-height: 150px; overflow-y: auto; margin-bottom: 20px; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
                    {% for group in context.groups %}
                        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; font-size: 0.9rem;">
                            <!-- Name is now "group_ids" (plural) -->
                            <input type="checkbox" name="group_ids" value="{{ group.id }}">
                            {{ group.name }}
                        </label>
                    {% endfor %}
                </div>
                
                <div style="display: flex; gap: 10px; justify-content: space-between;">
                    <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" style="background: #e4e6eb; color: #333; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; flex: 1;">Cancel</button>
                    <button type="submit" style="background: #001561; color: white; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; flex: 1;">Send</button>
                </div>
            </form>
        {% else %}
            <p style="color: #555; font-size: 0.9rem;">You are not the Admin of any groups yet.</p>
            <button onclick="document.getElementById('modal-container').innerHTML=''" style="background: #e4e6eb; color: #333; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Close</button>
        {% endif %}
    </div>
</div>
