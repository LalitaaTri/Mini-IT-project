{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <meta charset="UTF-8">
    <title>TeamUp MMU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'teamup_mmu/css/nav.css' %}">
</head>
<body>
    <nav>
        <a style="all:unset; cursor: pointer; display: contents;" href="/">
            <div class="logo">TeamUp <span class="MM">MM</span><span class="U">U</span></div>
        </a>
        <ul class="nav-middle">
            <li><a href="/matching/">Matching</a></li>
            <li><a href="/classes/">Your Classes</a></li>
            <li><a href="/groups/">Your Groups</a></li>
            <li><a href="/matches/">Your Matches</a></li>
            <li><a href="/inbox/">Inbox</a></li>
        </ul>
        <ul class="nav-right" style="display: flex; align-items: center; gap: 25px;">
            <li>
                <a href="/logout/" title="Logout" class="nav-icon-link">
                    <svg class="nav-icon" width="25px" height="25px" fill="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M440-440q17 0 28.5-11.5T480-480q0-17-11.5-28.5T440-520q-17 0-28.5 11.5T400-480q0 17 11.5 28.5T440-440ZM280-120v-80l240-40v-445q0-15-9-27t-23-14l-208-34v-80l220 36q44 8 72 41t28 77v512l-320 54Zm-160 0v-80h80v-560q0-34 23.5-57t56.5-23h400q34 0 57 23t23 57v560h80v80H120Zm160-80h400v-560H280v560Z"/>
                    </svg>
                </a>
            </li>
            <li>
                <a href="/my_profile/" style="all:unset; cursor:pointer;" title="My Profile">
                    <div class="profile-circle" style="font-size: 0.95rem; font-weight: 700; text-transform: uppercase;">{{ request.user_initial|default:"U" }}</div>
                </a>
            </li>
        </ul>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
    <div id="profile-modal-container"></div>
</body>

</html>
