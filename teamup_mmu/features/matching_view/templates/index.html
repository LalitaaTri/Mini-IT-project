{% extends "nav.html" %}
{% load static %}

{% block content %}
    <div style="text-align: center; margin-bottom: 10px;">
        <h2 style="color: #001561; margin-bottom: 2px; margin-top: 0px; font-size: 1.4rem;">Find Teammates</h2>
        <p style="color: #555; margin-top: 0; font-size: 0.85rem;">Swipe through MMU students looking for groups.</p>
    </div>

    <!-- THE FILTER BAR -->
    <form id="filter-form" 
          hx-get="/matching/" 
          hx-target="#user-list" 
          hx-trigger="change" 
          style="max-width: 950px; margin: 0 auto 15px auto; padding: 10px 18px; background: white; border-radius: 12px; border: 1.5px solid #e5e8ff; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; font-family: 'Inter', sans-serif;">
        
        <strong style="color: #001561; font-size: 0.95rem; padding-right: 4px;">Filters</strong>

        <select name="faculty" class="filter-item">
            <option value="">All Faculties</option>
            <option value="FCI" {% if context.filters.faculty == 'FCI' %}selected{% endif %}>FCI</option>
            <option value="FOE" {% if context.filters.faculty == 'FOE' %}selected{% endif %}>FOE</option>
            <option value="FCM" {% if context.filters.faculty == 'FCM' %}selected{% endif %}>FCM</option>
            <option value="FOM" {% if context.filters.faculty == 'FOM' %}selected{% endif %}>FOM</option>
        </select>

        <select name="year" class="filter-item">
            <option value="">Any Year</option>
            <option value="1" {% if context.filters.year == '1' %}selected{% endif %}>Year 1</option>
            <option value="2" {% if context.filters.year == '2' %}selected{% endif %}>Year 2</option>
            <option value="3" {% if context.filters.year == '3' %}selected{% endif %}>Year 3</option>
            <option value="4" {% if context.filters.year == '4' %}selected{% endif %}>Year 4</option>
            <option value="5" {% if context.filters.year == '5' %}selected{% endif %}>Year 5</option>
        </select>

        <div class="filter-item" style="gap: 4px; padding: 0 8px;">
            <span style="font-size: 0.8rem; color: #555;">CGPA</span>
            <input type="number" name="min_cgpa" value="{{ context.filters.min_cgpa }}" placeholder="Min" step="0.01" min="0" max="4" style="border: none; outline: none; width: 40px; background: transparent; text-align: center; font-size: 0.85rem; height: 100%;">
            <span style="color: #ccc;">-</span>
            <input type="number" name="max_cgpa" value="{{ context.filters.max_cgpa }}" placeholder="Max" step="0.01" min="0" max="4" style="border: none; outline: none; width: 40px; background: transparent; text-align: center; font-size: 0.85rem; height: 100%;">
        </div>

        <select name="min_common" class="filter-item">
            <option value="">Any Interests</option>
            <option value="1" {% if context.filters.min_common == '1' %}selected{% endif %}>1+ Shared Interest</option>
            <option value="2" {% if context.filters.min_common == '2' %}selected{% endif %}>2+ Shared Interests</option>
            <option value="3" {% if context.filters.min_common == '3' %}selected{% endif %}>3+ Shared Interests</option>
        </select>

        <select name="class_id" class="filter-item" style="max-width: 180px;">
            <option value="any" {% if context.filters.class_id == 'any' %}selected{% endif %}>Any Class</option>
            
            {% if context.my_classes %}
                <option value="all_my_classes" {% if context.filters.class_id == 'all_my_classes' %}selected{% endif %} style="font-weight: bold;">
                    ★ Matches ANY of My Classes
                </option>
                <optgroup label="My Specific Classes">
                    {% for c in context.my_classes %}
                        <option value="{{ c.id }}" {% if context.filters.class_id == c.id|stringformat:"s" %}selected{% endif %}>
                            {{ c.course_code }} ({{ c.section }})
                        </option>
                    {% endfor %}
                </optgroup>
            {% endif %}
        </select>
        
        <button type="button" 
                onclick="window.location.href='/matching/?faculty=&year=&min_cgpa=&max_cgpa=&min_common=&class_id=any'" 
                class="filter-item"
                style="background: #ffe5e5; border: none; color: #dc3545; font-weight: bold; cursor: pointer; transition: 0.2s;">
            Clear Filters
        </button>
    </form>

    <style>
        /* FILTER BAR UNIFORM HEIGHT FIX */
        .filter-item {
            height: 36px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #f8f9fa;
            color: #333;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Hide number spinners in CGPA inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        #user-list {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0 30px 0;
            min-height: 60vh;
            font-family: 'Inter', sans-serif;
        }

        .user-card {
            background-color: #ffffff;
            padding: 2.2rem 2.5rem;
            width: 88vw;
            max-width: 620px;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 2px solid #e5e8ff;
            position: relative;
        }

        .user-card h2 { color: #001561; margin: 8px 0 0 0; font-size: 1.6rem; }
        
        .user-card img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3.5px solid #e5e8ff;
            margin-bottom: 0.8rem;
        }

        .user-card p { font-size: 0.95rem; color: #333; line-height: 1.5; margin: 6px 0; }

        .interests-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; max-width: 600px;
        }
        .interest-pill {
            background: #e5e8ff; color: #001561; padding: 6px 14px; border-radius: 16px; font-size: 0.85rem; font-weight: 600;
        }

        /* BUTTON LAYOUT FIX: Powered by CSS Grid */
        .actions-wrapper {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .action-row form {
            margin: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        .action-btn {
            width: 100%;
            height: 100%;
            padding: 8px 10px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        
        .action-btn:hover { transform: translateY(-2px); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* Semantic Colors */
        .btn-like { background-color: #001561; color: white; }
        .btn-like:hover { background-color: #002299; }
        .btn-next { background-color: #e4e6eb; color: #333; }
        .btn-next:hover { background-color: #d0d3d9; }
        .btn-invite { background-color: #5b73df; color: white; }
        .btn-invite:hover { background-color: #4a62c9; }
        .btn-request { background-color: #28a745; color: white; }
        .btn-request:hover { background-color: #218838; }

    </style>

    <div id="user-list">
        {% include 'matching_view/templates/card.html' %}
    </div>
{% endblock %}
