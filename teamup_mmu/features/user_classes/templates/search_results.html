<span style="font-size: 0.85rem; font-weight: 600; color: #64748b; margin-bottom: 0.25rem;">Search Results</span>

{% for student in results %}
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; border: 1px solid #f1f5f9; background: #f8fafc; border-radius: 8px;">
        <div style="display: flex; flex-direction: column; gap: 0.15rem;">
            <span style="font-weight: 600; font-size: 0.9rem; color: #334155;">{{ student.username }}</span>
            <span style="font-size: 0.8rem; color: #64748b;">{{ student.email }}</span>
        </div>
        <button 
            hx-post="/classes/add_student_direct/{{ class_id }}/{{ student.id }}/"
            hx-swap="outerHTML"
            style="background: #00186d; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s;"
            onmouseover="this.style.background='#00114a'"
            onmouseout="this.style.background='#00186d'">
            Add
        </button>
    </div>
{% empty %}
    <span style="font-size: 0.85rem; color: #94a3b8; font-style: italic;">No students found matching your search.</span>
{% endfor %}
