
<div id="create-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;">
    
    <!-- The white popup box -->
    <div style="background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); position: relative;">
        
        <!-- Close button to remove the modal from the screen -->
        <button onclick="document.getElementById('create-modal').remove()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #555;">&times;</button>
        
        <h1 style="margin-top: 0; color: #00186d;">Create a Class</h1>
        
        <!-- Form that sends the data to the backend -->
        <form hx-post="/classes/create_class/" hx-target="#modal-container" hx-swap="outerHTML" style="display: flex; flex-direction: column; gap: 20px; margin-block-end: 0px;">
            {% csrf_token %}
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label for="course_code">Course Code</label>
                <input type="text" name="course_code" placeholder="e.g. CS101" required style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label for="course_name">Course Name</label>
                <input type="text" name="course_name" placeholder="e.g. Data Structures" required style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px;">
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <label for="description">Description</label>
                <textarea name="description" placeholder="Class description (optional)" style="padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; resize: vertical; min-height: 80px;"></textarea>
            </div>
            <!-- Optional spot to display error messages -->
            {% if error_message %}
                <p style="color: red; font-size: 0.85rem; margin: 0;">{{ error_message }}</p>
            {% endif %}

            <button type="submit" style="background-color: #008b20; color: white; border: none; padding: 12px; margin: 15px 0px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px;">Create Class</button>
        </form>
    </div>
</div>
