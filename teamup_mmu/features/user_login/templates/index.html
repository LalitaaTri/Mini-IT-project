{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <meta charset="UTF-8">
    <title>Log In - TeamUp MMU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'teamup_mmu/css/signup.css' %}">
</head>
<body>
    <nav>
        <a style="all:unset; cursor: pointer; display: contents;" href="/">
            <div class="logo">TeamUp <span class="MM">MM</span><span class="U">U</span></div>
        </a>
        <ul class="nav-middle">
            Creators: Shaun, Lalitaa, Alim
        </ul>
    </nav>
    <div class="container">
        <h2>Welcome Back</h2>
        
        <!-- Give the card an ID of auth-box -->
        <div class="form-card" id="auth-box">
            <form hx-post="/login/receive/" hx-target="#login-message" hx-swap="innerHTML">
                {% csrf_token %}
                <!-- Added autocomplete="username" -->
                <input type="email" name="email" placeholder="MMU Email Address" required autocomplete="username" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <!-- Added autocomplete="current-password" -->
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password" style="width: 100%; box-sizing: border-box; margin-bottom: 12px;">
                
                <button type="submit" style="width: 100%; box-sizing: border-box;">Log In</button>
            </form>
            
            <div id="login-message" style="margin-top: 15px; font-weight: bold; color: red;"></div>

            <!-- Neatly stacked links container -->
            <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 0.95rem;">
                <p style="margin: 0;">Don't have an account? <a href="/signup/" style="color: #001561; font-weight: bold; text-decoration: none;">Sign up here</a>.</p>
                <p style="margin: 0;"><a href="/user_forgot_password/" style="color: gray; text-decoration: none; font-size: 0.85rem;">Forgot password?</a></p>
            </div>
        </div> <!-- End of auth-box -->
    </div> <!-- End of container -->
</body>
</html>
