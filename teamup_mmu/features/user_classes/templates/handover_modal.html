<div id="handover-class-modal" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: white; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; margin: 16px;">
        
        <!-- Header -->
        <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between;">
            <h3 style="margin: 0; font-size: 1.5rem; font-weight: 700; color: #00186d;">👑 Transfer Ownership</h3>
            <button 
                onclick="document.getElementById('handover-class-modal').remove()" 
                style="background: none; border: none; font-size: 1.5rem; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; transition: background-color 0.2s;"
                onmouseover="this.style.backgroundColor='#f1f5f9'; this.style.color='#64748b'"
                onmouseout="this.style.backgroundColor='transparent'; this.style.color='#94a3b8'"
                title="Close">&times;</button>
        </div>
        
        <!-- Transfer ownership form -->
        <form style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;" hx-post="/classes/handover/{{ class_id }}/" hx-target="#handover-status">
            
            <p style="margin: 0; color: #64748b; font-size: 0.95rem; line-height: 1.5;">Select a student to promote to lecturer/admin for <strong>"{{ class_details.course_name }}"</strong>. You will be demoted to student.</p>
            
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label style="font-weight: 600; color: #475569; font-size: 0.88rem;">New Class Admin</label>
                <select name="new_admin_id" required style="width: 100%; padding: 0.75rem 2.5rem 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; appearance: none; -webkit-appearance: none; background: white url(&quot;data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e&quot;) no-repeat right 1rem center; background-size: 1.2em;" onfocus="this.style.borderColor='#00186d'" onblur="this.style.borderColor='#cbd5e1'">
                    <option value="" disabled selected>Select user to promote...</option>
                    {% for student in class_students %}
                        <option value="{{ student.user_id }}">{{ student.username|default:student.email }} ({{ student.email }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Status message container -->
            <div id="handover-status" style="text-align: center; font-size: 0.9rem; min-height: 20px;"></div>

            <!-- Action Buttons -->
            <div style="display: flex; gap: 0.75rem; margin-top: 0.5rem;">
                <button type="button" onclick="document.getElementById('handover-class-modal').remove()" style="flex: 1; padding: 10px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; font-weight: 600; color: #475569; cursor: pointer; font-size: 0.95rem; transition: background 0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f1f5f9'">Cancel</button>
                <button type="submit" style="flex: 1; padding: 10px; background-color: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2); transition: background 0.2s;" onmouseover="this.style.backgroundColor='#dc2626'" onmouseout="this.style.backgroundColor='#ef4444'">Transfer</button>
            </div>
        </form>
    
    </div>
</div>
