<div id="details-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;">
    <!-- The white popup box -->
    <div style="background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); position: relative;">
        <!-- Close button to remove the modal from the screen -->
        <button onclick="document.getElementById('details-modal').remove()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #555;">&times;</button>
        
        <h1 style="margin-top: 0; color: #00186d;">Class Details</h1>
        <!-- Display class details here -->
    </div>
</div>
