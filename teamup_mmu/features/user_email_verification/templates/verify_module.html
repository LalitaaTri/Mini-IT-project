<h2 style="margin-top: 0;">Verify Your Email</h2>
<p style="text-align: center; color: #555; margin-bottom: 20px;">We sent a code to <strong>{{ email }}</strong>.</p>

<div id="email-verification-container">
    <!-- Submit Code Form -->
    <!-- Notice it will redirect to profile_setup if successful (handled in your verification views.py) -->
    <form id="email-verification-form" hx-post="/email_verification/receive/" hx-target="#auth-box" hx-swap="innerHTML">
        {% csrf_token %}
        <input type="text" name="code" placeholder="8-Letter Code" required style="text-align: center; font-size: 1.2rem; letter-spacing: 2px;">
        <input type="hidden" name="email" value="{{ email }}">
        <button type="submit" style="margin-top: 10px;">Verify</button>
    </form>
    
    <!-- Resend Code Form -->
    <form id="email-verification-send" hx-post="/email_verification/send/" hx-target="#resend-msg" hx-swap="innerHTML" style="margin-top: 15px;">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ email }}">
        <button type="submit" style="background: none; color: gray; border: none; cursor: pointer; text-decoration: underline; width: 100%; padding: 0;">Resend Code</button>
    </form>
    <div id="resend-msg" style="text-align: center; font-size: 0.85rem; margin-top: 10px; font-weight: bold; color: #001561;"></div>
</div>
